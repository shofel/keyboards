name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The reusable qmk_userspace_build workflow declares `contents: write` for
# itself; a called workflow can't be granted more than its caller holds, so
# without this the run fails at startup on repos with a read-only default token.
permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Host tests (bisect, oneshot, compose, scheme drift)
        run: make test

  build:
    uses: qmk/.github/.github/workflows/qmk_userspace_build.yml@main
    with:
      # Build against shofel/qmk_firmware, NOT upstream: the keymap lives in a
      # userspace `layouts/` dir, and only the fork's "Recognize layouts from a
      # userspace" patch (73b8698b9d) makes QMK resolve it — upstream 0.31.3
      # fails with "Could not find keymap" for both boards. Pinned to a SHA for
      # reproducibility (public repo, cloned anonymously by the reusable build).
      qmk_repo: shofel/qmk_firmware
      qmk_ref: 87085c3a81d3b460636d1047c26bc0d9e6e9021d
