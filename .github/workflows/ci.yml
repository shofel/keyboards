name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The reusable qmk_userspace_build workflow declares `contents: write` for
# itself; a called workflow can't be granted more than its caller holds, so
# without this the run fails at startup on repos with a read-only default token.
permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Host tests (bisect, oneshot, compose, scheme drift)
        run: make test

  build:
    uses: qmk/.github/.github/workflows/qmk_userspace_build.yml@main
    with:
      qmk_repo: qmk/qmk_firmware
      qmk_ref: 0.31.3
